    <main>
        <div id="countdown"></div>
        <script>
            function daysUntilMarch13() {
                const today = new Date();
                const year = today.getFullYear();
                const march13 = new Date(year, 2, 13); // Months are 0-indexed in JavaScript
    
                if (today > march13) {
                    march13.setFullYear(year + 1);
                }
    
                const oneDay = 24 * 60 * 60 * 1000; // Milliseconds in one day
                const daysRemaining = Math.round((march13 - today) / oneDay);
    
                return daysRemaining;
            }
    
            document.getElementById('countdown').innerText = `Dnu do formuli: ${daysUntilMarch13()}`;
        </script>
    </main>
